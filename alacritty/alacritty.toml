[general]
import = [
    "C:\\Users\\CipherOfTheVoid\\AppData\\Roaming\\alacritty\\themes\\themes\\kanagawa_dragon.toml"
#
# DOWNLOAD FROM:
# https://github.com/alacritty/alacritty-theme
#
# THEMES:
#
# SOFT COLORS:
#
# - autumn
# - citylights
# - wombat
# - tomorrow_night
# - taerminal
# - remedy_dark
# - monokai_pro
# - kanagawa_dragon
# - kanagawa_wave
# - everforest_dark
# - gruvbox_dark
# - gruvbox_material_hard_dark
#
# CONTRAST COLORS:
#
# - ayu_dark
#
# VIVID:
#
# - catppuccin_mocha
# - enfocado_dark
# - rose_pine
# - palenight
# - night_owl
#
# GREY:
#
# - doom_one 
# - nordic
]

[env]
TERM = "alacritty"
COLORTERM = "truecolor"
LANG = "en_US.UTF-8"

[font]
size = 11

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

# Если Hack Nerd Font не найден, запасной вариант:
# [font.normal]
# family = "JetBrainsMono Nerd Font"
# style = "Regular"

# [font.normal]
# family = "FiraCode Nerd Font"
# style = "Regular"

[window]
decorations = "None"
dynamic_padding = true
opacity = 0.8
startup_mode = "Maximized"

[window.padding]
x = 15
y = 15

# ============================================
# КОМАНДА ЗАПУСКА - универсальная
# ============================================
# ВАРИАНТ 1: Запускать оболочку по умолчанию (рекомендую)
# Просто закомментируйте блок [terminal.shell] полностью

# ВАРИАНТ 2: Если очень нужно указать конкретный shell
# Для WSL (Debian):
# [terminal.shell]
# program = "/usr/bin/bash"
# program = "/usr/bin/zsh"

# ВАРИАНТ 3: Для WSL с явным указанием дистрибутива
# (НЕ РАБОТАЕТ НА ARCH! Используйте только для WSL)
[terminal.shell]
program = "wsl"
args = ["-d", "Debian", "--cd", "~"]
