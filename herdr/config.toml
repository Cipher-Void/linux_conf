onboarding = false

[ui]
host_cursor = "native" # Если мерцание — поставьте "drawn"

[theme]
name = "kanagawa"
auto_switch = false

[keys]
prefix = "ctrl+a"

# ==========================================
# 1. WORKSPACES (Рабочие пространства)
# ==========================================
# Переключение
previous_workspace = "prefix+alt+k"      # Назад
next_workspace     = "prefix+alt+j"      # Вперед
# last_workspace     = ""      # Последний использованный

# Операции
new_workspace    = ["prefix+shift+n", "prefix+alt+n"] # Создать
new_worktree     = ["prefix+shift+g", "prefix+alt+g"] # Создать из Git
rename_workspace = ["prefix+shift+w", "prefix+alt+w"] # Переименовать
close_workspace  = ["prefix+shift+d", "prefix+alt+d"] # Закрыть

# Меню выбора workspace
workspace_picker = "prefix+w"  # Выбрать воркспейс
navigate_workspace_up   = "k"  # Назад
navigate_workspace_down = "j"  # Вперед

# ==========================================
# 2. TABS (Вкладки)
# ==========================================
# Навигация
next_tab      = ["prefix+n", "prefix+shift+right"] # Следующая
previous_tab  = ["prefix+p", "prefix+shift+left"]  # Предыдущая
last_tab      = "prefix+tab"                       # Последняя использованная
switch_tab    = "prefix+1..9"                      # Прямой переход

# Операции
new_tab      = "prefix+c"                          # Создать
rename_tab   = ["prefix+shift+t", "prefix+alt+t"]  # Переименовать
close_tab    = ["prefix+shift+x", "prefix+alt+x"]  # Закрыть

# ==========================================
# 3. PANES (Панели)
# ==========================================
# Фокус (Навигация по панелям)
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# Операции
split_vertical   = "prefix+v"                    # Разделить вправо
split_horizontal = ["prefix+minus", "prefix+s"]  # Разделить вниз
close_pane       = "prefix+x"                    # Закрыть
zoom             = "prefix+z"                    # Развернуть
resize_mode      = "prefix+r"                    # Режим изменения размера

# Перемещение (Swap)
swap_pane_left  = ["prefix+shift+h", "prefix+alt+h"] # Поменять с левой
swap_pane_down  = ["prefix+shift+j", "prefix+alt+j"] # Поменять с нижней
swap_pane_up    = ["prefix+shift+k", "prefix+alt+k"] # Поменять с верхней
swap_pane_right = ["prefix+shift+l", "prefix+alt+l"] # Поменять с правой

# Цикл (Перебор)
# "prefix+tab" - занят last_tab
# cycle_pane_next     = ["prefix+tab", "prefix+alt+tab"]     # Следующая
# cycle_pane_previous = "prefix+shift+tab"                   # Предыдущая

# ==========================================
# 4. РЕЖИМЫ И КОНФИГУРАЦИЯ
# ==========================================
settings = "prefix+alt+s" # Открыть настройки
goto     = "prefix+g"     # Перейти к вкладке/панели по имени/сессии

# Помощь и перезагрузка
help          = ["prefix+?", "prefix+alt+slash"]    # ? это shift+/, добавляем alt+/
reload_config = ["prefix+shift+r", "prefix+alt+r"]  # Перезагрузить конфиг
detach        = "prefix+q"                          # Отключиться от сессии

# ==========================================
# 5. РЕДАКТИРОВАНИЕ / СКРОЛЛБЕК
# ==========================================
copy_mode       = "prefix+["  # Режим копирования
edit_scrollback = "prefix+e"  # Открыть буфер в редакторе
toggle_sidebar  = "prefix+b"  # Боковая панель
open_notification_target = "prefix+o"  # Открыть/показать всплывающее уведомление от агента

